name: C++ CI com cobertura

on:
  push:
    branches: [ workflow_teste ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ lcov

      - name: Criar pasta de build
        run: mkdir build

      - name: Rodar CMake com cobertura
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compilar projeto
        run: cmake --build build

      - name: Executar testes
        run: cd build && ctest --output-on-failure

      - name: Gerar relatório de cobertura com lcov
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/googletest/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Gerar HTML do relatório de cobertura
        run: |
          cd build
          genhtml coverage.info --output-directory coverage-html

      - name: Upload do relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage-html
