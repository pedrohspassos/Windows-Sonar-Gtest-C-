name: C++ CI com cobertura multiplataforma (llvm-cov)

on:
  push:
    branches: [workflow_teste_02_att_clang_linux]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake llvm llvm-profdata llvm-cov lcov

      - name: Configurar projeto com cobertura
        run: cmake -S . -B build -DCODE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Compilar projeto
        run: cmake --build build

      - name: Rodar testes e gerar dados de cobertura
        run: |
          LLVM_PROFILE_FILE="build/program.profraw" ./build/main

      - name: Gerar arquivo profdata
        run: |
          llvm-profdata merge -sparse build/program.profraw -o build/program.profdata

      - name: Gerar relatório HTML
        run: |
          llvm-cov show ./build/main -instr-profile=build/program.profdata -format=html -output-dir=build/coverage-html

      - name: Gerar relatório XML (Cobertura)
        run: |
          llvm-cov export ./build/main -instr-profile=build/program.profdata -format=cobertura > build/coverage.xml

      - name: Upload dos relatórios
        uses: actions/upload-artifact@v4
        with:
          name: llvm-cov-coverage-report
          path: |
            build/coverage-html
            build/coverage.xml
