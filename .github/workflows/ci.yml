name: C++ CI com MSVC e cobertura (OpenCppCoverage)

on:
  workflow_dispatch:
  push:
    branches: [ msvc-coverage ]  # Ajuste conforme sua branch

jobs:
  build-and-test-msvc:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar CMake
        uses: lukka/get-cmake@latest

      - name: Baixar e extrair OpenCppCoverage
        run: |
          curl -Lo OpenCppCoverage.zip https://github.com/OpenCppCoverage/OpenCppCoverage/releases/latest/download/OpenCppCoverage.zip
          powershell -Command "Expand-Archive OpenCppCoverage.zip -DestinationPath OpenCppCoverageDir"

      - name: Listar arquivos na pasta OpenCppCoverageDir (debug)
        run: Get-ChildItem -Recurse -Path OpenCppCoverageDir

      - name: Configurar projeto com CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compilar projeto com MSVC
        run: cmake --build build --config Debug

      - name: Rodar testes com cobertura
        run: |
          $coverageExe = Get-ChildItem -Path OpenCppCoverageDir -Recurse -Filter OpenCppCoverage.exe | Select-Object -First 1
          if (-not $coverageExe) {
            Write-Error "OpenCppCoverage.exe não encontrado!"
            exit 1
          }

          & $coverageExe.FullName `
            --export_type cobertura:cobertura.xml `
            --modules build\Debug\* `
            --sources src `
            --sources include `
            -- build\Debug\calculator_tests.exe
        shell: pwsh

      - name: Upload do relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-msvc
          path: cobertura.xml
