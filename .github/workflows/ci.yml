name: C++ CI com cobertura multiplataforma

on:
  push:
    branches: [ workflow_teste_02_att_msvc ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pip
          pip install --upgrade gcovr

      - name: Configurar CMake com cobertura
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCODE_COVERAGE=ON

      - name: Compilar projeto
        run: cmake --build build

      - name: Rodar testes
        run: cd build && ctest --output-on-failure

      - name: Gerar relatório XML com gcovr
        run: |
          cd build
          gcovr -r .. \
            --exclude '.*_deps/.*' \
            --exclude '.*main\.cpp' \
            --xml-pretty -o coverage.xml

      - name: Gerar relatório HTML com gcovr
        run: |
          cd build
          gcovr -r .. \
            --exclude '.*_deps/.*' \
            --exclude '.*main\.cpp' \
            --html --html-details -o coverage.html

      - name: Upload do relatório (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: |
            build/coverage.html
            build/coverage.xml

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar CMake
        uses: lukka/get-cmake@latest

      - name: Baixar OpenCppCoverage
        run: |
          curl -Lo OpenCppCoverage.zip https://github.com/OpenCppCoverage/OpenCppCoverage/releases/latest/download/OpenCppCoverage.zip
          powershell -Command "Expand-Archive -Path OpenCppCoverage.zip -DestinationPath OpenCppCoverage"

      - name: Configurar CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compilar com MSVC
        run: cmake --build build --config Debug

      - name: Rodar testes com cobertura no Windows
        run: |
          & "$PWD\OpenCppCoverage\OpenCppCoverage.exe" `
            --export_type cobertura:cobertura.xml `
            --modules build\Debug\* `
            --sources src `
            --sources include `
            -- build\Debug\calculator_tests.exe
        shell: pwsh


      - name: Upload do relatório (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows
          path: cobertura.xml
